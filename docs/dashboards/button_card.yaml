# Requires the button-card frontend card from HACS (tested with 7.0.1):
# https://github.com/custom-cards/button-card
# Labels are German and the entity IDs those of a German Home Assistant
# installation (module "Fonterra"); adapt both to your installation.
title: Heizung
views:
- type: sections
  max_columns: 4
  title: Fonterra
  path: fonterra
  icon: mdi:radiator
  sections:
  - type: grid
    column_span: 4
    cards:
    - type: heading
      heading: Viega Fonterra · Fonterra
      heading_style: title
      icon: mdi:heating-coil
    - type: custom:button-card
      show_name: false
      show_icon: false
      show_state: false
      tap_action:
        action: none
      styles:
        card:
        - background: none
        - box-shadow: none
        - border: none
        - padding: '0'
        grid:
        - display: flex
        - flex-wrap: wrap
        - gap: 10px
        custom_fields:
          p1:
          - width: auto
          p2:
          - width: auto
          p3:
          - width: auto
          p4:
          - width: auto
      custom_fields:
        p1:
          card:
            type: custom:button-card
            entity: sensor.fonterra_vorlauftemperatur
            show_name: false
            show_icon: false
            show_state: false
            tap_action:
              action: more-info
            styles:
              card:
              - background: none
              - box-shadow: none
              - border: none
              - border-radius: 6px
              - padding: '0'
              - background: var(--ha-card-background,var(--card-background-color))
              - border: 1px solid var(--divider-color)
              - border-radius: 20px
              - padding: 7px 16px
              - width: auto
              grid:
              - grid-template-areas: '"v"'
              custom_fields:
                v:
                - justify-self: stretch
                - text-align: left
                - font-size: 14px
                - white-space: nowrap
            custom_fields:
              v: |
                [[[[
                const v=parseFloat(entity.state);
                return `<ha-icon icon="mdi:thermometer-water" style="--mdc-icon-size:18px;color:var(--secondary-text-color);vertical-align:-3px"></ha-icon> Vorlauf <b>${isNaN(v)?'–':v.toFixed(1).replace('.',',')+' °C'}</b>`;
                ]]]]
        p2:
          card:
            type: custom:button-card
            entity: binary_sensor.fonterra_umwalzpumpe
            show_name: false
            show_icon: false
            show_state: false
            tap_action:
              action: more-info
            styles:
              card:
              - background: none
              - box-shadow: none
              - border: none
              - border-radius: 6px
              - padding: '0'
              - background: var(--ha-card-background,var(--card-background-color))
              - border: 1px solid var(--divider-color)
              - border-radius: 20px
              - padding: 7px 16px
              - width: auto
              grid:
              - grid-template-areas: '"v"'
              custom_fields:
                v:
                - justify-self: stretch
                - text-align: left
                - font-size: 14px
                - white-space: nowrap
            custom_fields:
              v: |
                [[[[
                const on=entity.state==='on';const c=on?'var(--success-color,#4caf50)':'var(--primary-text-color)';
                return `<ha-icon icon="mdi:pump" style="--mdc-icon-size:18px;color:var(--secondary-text-color);vertical-align:-3px"></ha-icon> Pumpe <b style="color:${c}">${on?'läuft':'aus'}</b>`;
                ]]]]
        p3:
          card:
            type: custom:button-card
            entity: sensor.fonterra_aktuell_geoffnete_aktoren
            show_name: false
            show_icon: false
            show_state: false
            tap_action:
              action: more-info
            styles:
              card:
              - background: none
              - box-shadow: none
              - border: none
              - border-radius: 6px
              - padding: '0'
              - background: var(--ha-card-background,var(--card-background-color))
              - border: 1px solid var(--divider-color)
              - border-radius: 20px
              - padding: 7px 16px
              - width: auto
              grid:
              - grid-template-areas: '"v"'
              custom_fields:
                v:
                - justify-self: stretch
                - text-align: left
                - font-size: 14px
                - white-space: nowrap
            custom_fields:
              v: |
                [[[[
                const n=parseFloat(entity.state);const c=n>0?'var(--warning-color,#ffa726)':'var(--primary-text-color)';
                return `<ha-icon icon="mdi:valve" style="--mdc-icon-size:18px;color:var(--secondary-text-color);vertical-align:-3px"></ha-icon> Kreise offen <b style="color:${c}">${isNaN(n)?'–':n} / 5</b>`;
                ]]]]
        p4:
          card:
            type: custom:button-card
            entity: binary_sensor.fonterra_basiseinheit_fehler
            show_name: false
            show_icon: false
            show_state: false
            tap_action:
              action: more-info
            styles:
              card:
              - background: none
              - box-shadow: none
              - border: none
              - border-radius: 6px
              - padding: '0'
              - background: var(--ha-card-background,var(--card-background-color))
              - border: 1px solid var(--divider-color)
              - border-radius: 20px
              - padding: 7px 16px
              - width: auto
              grid:
              - grid-template-areas: '"v"'
              custom_fields:
                v:
                - justify-self: stretch
                - text-align: left
                - font-size: 14px
                - white-space: nowrap
            custom_fields:
              v: |
                [[[[
                const err=entity.state==='on';const cs=states['sensor.fonterra_basiseinheit_fehlercode'];const code=cs?cs.state:'–';
                const c=err?'var(--error-color,#f44336)':'var(--success-color,#4caf50)';
                return `<ha-icon icon="${err?'mdi:alert-circle':'mdi:check-circle'}" style="--mdc-icon-size:18px;color:${c};vertical-align:-3px"></ha-icon> Fehler <b style="color:${c}">${err?'Code '+code:'keiner (Code '+code+')'}</b>`;
                ]]]]
      grid_options:
        columns: full
  - type: grid
    cards:
    - type: custom:button-card
