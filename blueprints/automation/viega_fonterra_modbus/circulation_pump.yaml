blueprint:
  name: Viega Fonterra – circulation pump
  description: >-
    Switches a separately wired circulation pump from the Viega Fonterra
    circulation-pump indicator(s): on as soon as any actuator opens, off once
    all actuators have been closed for the run-on time. If an actuator opens
    again during the run-on time, the pump simply stays on.


    Select one indicator per Viega module that feeds this pump - e.g. all
    three floors for one shared pump, or just one floor for a pump of its
    own. While an indicator is unavailable or unknown, the pump is not
    switched off.
  domain: automation
  source_url: https://github.com/mikefogel/homeassistant-viega-fonterra-modbus/blob/main/blueprints/automation/viega_fonterra_modbus/circulation_pump.yaml
  homeassistant:
    min_version: "2024.6.0"
  input:
    pump_indicator:
      name: Circulation-pump indicator(s)
      description: >-
        The "Circulation pump" binary sensor of every Viega Fonterra module
        whose heating circuits this pump supplies.
      selector:
        entity:
          multiple: true
          filter:
            - integration: viega_fonterra_modbus
              domain: binary_sensor
    pump_switch:
      name: Pump switch
      description: The switch (e.g. a smart relay) that powers the circulation pump.
      selector:
        entity:
          filter:
            - domain:
                - switch
                - light
                - input_boolean
    run_on_time:
      name: Run-on time
      description: >-
        How long the pump keeps running after the last actuator has closed.
        Set to 0 to switch it off immediately.
      default:
        minutes: 5
      selector:
        duration: {}

mode: queued

variables:
  # A single entity (automations created with an older version of this
  # blueprint) or a list of entities.
  indicators: !input pump_indicator
  indicator_states: >-
    {{ expand(indicators) | map(attribute='state') | list }}

trigger:
  - platform: state
    entity_id: !input pump_indicator
    to: "on"
    id: pump_on
  # Fires once an indicator has stayed "off" for the whole run-on time; the
  # condition below then checks that all the others are off too.
  - platform: state
    entity_id: !input pump_indicator
    to: "off"
    for: !input run_on_time
    id: pump_off
  # Catch up after a Home Assistant restart while actuators are open.
  - platform: homeassistant
    event: start
    id: started

action:
  - choose:
      - conditions:
          - condition: or
            conditions:
              - condition: trigger
                id: pump_on
              - condition: and
                conditions:
                  - condition: trigger
                    id: started
                  - condition: template
                    value_template: "{{ 'on' in indicator_states }}"
        sequence:
          - service: homeassistant.turn_on
            target:
              entity_id: !input pump_switch
      - conditions:
          - condition: trigger
            id: pump_off
          - condition: template
            value_template: >-
              {{ indicator_states | length > 0
                 and indicator_states | select('ne', 'off') | list | length == 0 }}
        sequence:
          - service: homeassistant.turn_off
            target:
              entity_id: !input pump_switch
