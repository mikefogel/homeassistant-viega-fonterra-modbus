[pytest]
; Adds the repo root to sys.path so `custom_components...` imports resolve
; without needing PYTHONPATH set manually or an editable install.
pythonpath = .
testpaths = tests
; Required by pytest-homeassistant-custom-component: its `hass` fixture and
; other async fixtures/tests are only auto-detected and awaited in "auto"
; mode - without it, `hass` resolves to an un-awaited async_generator object
; instead of a HomeAssistant instance.
asyncio_mode = auto
